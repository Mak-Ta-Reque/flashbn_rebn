# FlashBN / ReBN defaults for Tiny ImageNet. Every key can be overridden on the command line.

seed: 0                       # retraining subset, data order, model init RNG
batch_size: 256
num_workers: 4
save_model: true              # write defended_model.pt

# Step 1 (FlashBN): BN initialization from a clean pool of training images
init_mode: hist_clip          # hist_clip | pgd_hist_clip | confidence_recalib_opt | reset_affine | fisher_noise
pool_size: 2000
pool_seed: 42
confidence_threshold: 0.8     # pool images used for statistics: max-softmax >= threshold
clip_low_pct: 0.5             # hist_clip: per-channel BN-input clipping range
clip_high_pct: 99.5
affine_opt_steps: 100         # pgd_hist_clip / confidence_recalib_opt: Adam fit of the BN scale/shift
affine_opt_lr: 0.01
confidence_patience: 2        # stop the fit when confidence stops improving (0 = all steps)
reset_last_n: -1              # reset_affine: last n BN layers (-1 = all)
fisher_ratio: 0.001           # fisher_noise: fraction of BN parameters replaced
noise_std: 0.01
isc_pct: 0.0                  # per-sample statistic clipping to [p, 100-p] (0 = off)
fp_ratio: 0.0                 # BN fine-pruning: fraction of channels zeroed (0 = off)
fp_layers: 2                  # ... in the last n BN layers

# Step 2 (ReBN only): retrain only the BN scale/shift
epochs: 20                    # 0 = step 1 only
lr: 0.001
ft_optimizer: sgd             # sgd (momentum 0.9) | adam | adamw
weight_decay: 0.01            # adamw only
ft_ratio: 0.01    # 1,000 of 100,000 training images
bn_stats: frozen              # frozen | update (BN running statistics during retraining)
test_interval: 10             # evaluate every n epochs (and after the last)
ft_noise_std: 0.0             # Gaussian noise on the retraining inputs
affine_l2: 0.0                # L2 anchor on the BN scale/shift ...
affine_l2_ref: orig           # ... to the original values (orig) or the values after step 1 (init)
l1_gamma: 0.0                 # L1 on the BN scale

# Step 2 filters against backdoor regrowth (0 = off)
protect_ratio: 0.0            # freeze the channels whose clean statistics moved most (fraction per BN layer)
kd_step1: 0.0                 # weight of distillation from the step-1 model
kd_T: 4.0                     # distillation temperature
